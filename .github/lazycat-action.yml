version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/wxocr.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: wxocr
    bump: patch
build:
  run_buildscript: false
images:
  - id: wxocr
    target: service
    service: wxocr
    source: golangboyme/wxocr
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true
stores:
  official:
    enabled: false
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: WeChat OCR API
    summary: "使用微信 OCR 引擎的文本识别的 Docker 化 REST API 服务"
